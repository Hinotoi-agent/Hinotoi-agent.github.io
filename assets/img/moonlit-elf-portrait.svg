<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit elven archivist</title>
  <desc id="desc">An original close portrait of a silver-haired elf with luminous green eyes beneath a clouded indigo night sky.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111a32"/><stop offset=".56" stop-color="#29334e"/><stop offset="1" stop-color="#58637b"/></linearGradient>
    <radialGradient id="moon" cx="24%" cy="12%" r="68%"><stop stop-color="#a9cae2" stop-opacity=".5"/><stop offset="1" stop-color="#8292bc" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6c9c4"/><stop offset=".55" stop-color="#9e9298"/><stop offset="1" stop-color="#514e60"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5edf2"/><stop offset=".34" stop-color="#aab6c6"/><stop offset=".72" stop-color="#68738a"/><stop offset="1" stop-color="#30394d"/></linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dad5ce"/><stop offset="1" stop-color="#6c7181"/></linearGradient>
    <radialGradient id="iris" cx="45%" cy="42%" r="60%"><stop stop-color="#c5f38b"/><stop offset=".5" stop-color="#54b877"/><stop offset="1" stop-color="#14583f"/></radialGradient>
    <filter id="eyeGlow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="800" height="800" fill="url(#night)"/>
  <rect width="800" height="800" fill="url(#moon)"/>
  <g fill="#0d1428" opacity=".72" filter="url(#soft)"><ellipse cx="110" cy="155" rx="190" ry="82"/><ellipse cx="694" cy="204" rx="202" ry="90"/><ellipse cx="425" cy="78" rx="166" ry="53"/></g>
  <g fill="#c6d7e5" opacity=".72"><circle cx="91" cy="286" r="3"/><circle cx="688" cy="115" r="3"/><circle cx="739" cy="324" r="2"/><circle cx="163" cy="102" r="2"/></g>

  <!-- Long ears behind the face -->
  <path d="M250 340 57 257l161 166Z" fill="#988b93" stroke="#282b3d" stroke-width="12" stroke-linejoin="round"/>
  <path d="m220 352-118-72 105 105Z" fill="#5f5767"/>
  <path d="M572 326 783 286 607 425Z" fill="#8f838d" stroke="#282b3d" stroke-width="12" stroke-linejoin="round"/>
  <path d="m606 351 123-46-111 82Z" fill="#554f60"/>

  <!-- Hair mass and shoulders -->
  <path d="M180 800c-20-151 4-301 45-432C267 235 366 158 481 170c132 14 209 126 223 273 12 125-8 244-17 357Z" fill="url(#hair)" stroke="#22283a" stroke-width="14"/>
  <path d="M91 800c58-142 176-209 304-210 150-2 270 62 333 210Z" fill="url(#cloak)" stroke="#252a3a" stroke-width="13"/>
  <path d="M264 645c82 51 185 53 272 0l50 155H216Z" fill="#263047" opacity=".76"/>
  <path d="M298 656c41 33 159 35 203 0l-17 91H315Z" fill="#c1bdb9" stroke="#604d53" stroke-width="9"/>
  <path d="M311 697h177" stroke="#8b6a61" stroke-width="13"/>

  <!-- Face -->
  <path d="M256 247c62-74 180-94 268-49 72 37 114 117 102 213-11 88-74 183-151 222-63 32-135 13-190-44-62-64-88-165-63-248 8-29 19-62 34-94Z" fill="url(#skin)" stroke="#25293a" stroke-width="12"/>

  <!-- Hair framing and bangs -->
  <path d="M232 374c-7-176 86-270 228-262 127 7 214 110 201 274-28-86-75-145-131-181-18 45-46 81-86 112-16-36-25-77-29-121-30 58-79 114-183 178Z" fill="url(#hair)" stroke="#252a3a" stroke-width="13"/>
  <path d="M331 150c5 89-23 169-101 244M437 139c28 88 12 169-44 246M544 177c28 69 22 139-17 212" fill="none" stroke="#e7edf1" stroke-width="17" opacity=".62"/>
  <path d="M255 462c-32 72-38 164-6 244M585 445c36 75 47 164 26 248" fill="none" stroke="#778297" stroke-width="35"/>
  <path d="M258 464c-22 72-27 143-8 213M588 449c26 73 33 145 20 214" fill="none" stroke="#cbd3dc" stroke-width="12" opacity=".65"/>

  <!-- Green eyes -->
  <g>
    <path d="M276 412c37-39 91-42 137-9-39 60-101 61-137 9Z" fill="#121b22"/>
    <path d="M292 408c31-23 70-22 103 0-28 38-76 40-103 0Z" fill="url(#iris)"/>
    <ellipse cx="344" cy="410" rx="10" ry="20" fill="#092e25"/><circle cx="328" cy="396" r="6" fill="#e2ffc4"/>
    <path d="M275 407c42-43 96-40 143 1" fill="none" stroke="#161a27" stroke-width="15" stroke-linecap="round"/>
    <path d="M455 404c41-31 94-23 126 19-48 47-106 36-126-19Z" fill="#121b22"/>
    <path d="M471 407c31-17 66-10 91 13-33 31-74 24-91-13Z" fill="url(#iris)"/>
    <ellipse cx="520" cy="415" rx="10" ry="20" fill="#092e25"/><circle cx="507" cy="402" r="6" fill="#e2ffc4"/>
    <path d="M453 399c46-31 97-18 132 24" fill="none" stroke="#161a27" stroke-width="15" stroke-linecap="round"/>
    <g fill="#73d890" opacity=".3" filter="url(#eyeGlow)"><ellipse cx="346" cy="411" rx="68" ry="25"/><ellipse cx="520" cy="416" rx="60" ry="24"/></g>
  </g>

  <path d="M418 438c-7 34-4 61 10 76l-25 11" fill="none" stroke="#625b67" stroke-width="8" stroke-linecap="round"/>
  <path d="M380 564c38 18 79 19 116-3" fill="none" stroke="#76535b" stroke-width="8" stroke-linecap="round"/>
  <path d="M332 367c31-20 68-24 102-9M467 359c33-10 70-4 98 17" fill="none" stroke="#4a4554" stroke-width="12" stroke-linecap="round"/>

  <!-- Garnet earrings -->
  <g stroke="#3a2536" stroke-width="8">
    <path d="M219 428v60"/><path d="M625 430v62"/>
    <path d="M219 473c-25 31-23 67 0 79 23-12 25-48 0-79Z" fill="#9b3e69"/>
    <path d="M625 476c-25 31-23 67 0 79 23-12 25-48 0-79Z" fill="#9b3e69"/>
  </g>

  <!-- Cool moonlit rim -->
  <path d="M184 797c-13-160 12-315 67-432 42-90 111-160 198-186" fill="none" stroke="#b7d6e8" stroke-width="12" opacity=".76"/>
  <path d="M650 274c49 99 66 217 42 350" fill="none" stroke="#9fc1d9" stroke-width="10" opacity=".64"/>
  <path d="M70 748c95-20 173-9 238 32M560 783c69-36 135-45 207-28" fill="none" stroke="#819dc4" stroke-width="8" opacity=".35"/>
</svg>
