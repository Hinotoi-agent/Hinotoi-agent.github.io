<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-labelledby="title desc">
  <title id="title">An elven mage and companions walking</title>
  <desc id="desc">Original chibi-style fan art of a white-haired elf mage, a purple-haired mage, and a red-haired warrior traveling together.</desc>
  <defs>
    <linearGradient id="elfCloak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe8d4"/><stop offset="1" stop-color="#7fa18a"/></linearGradient>
    <linearGradient id="mageCloak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7d708f"/><stop offset="1" stop-color="#3e405d"/></linearGradient>
    <linearGradient id="warriorCoat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b66d55"/><stop offset="1" stop-color="#74483d"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <g opacity=".2" fill="#17251f" filter="url(#softShadow)">
    <ellipse cx="95" cy="169" rx="54" ry="9"/><ellipse cx="232" cy="169" rx="53" ry="9"/><ellipse cx="365" cy="169" rx="55" ry="9"/>
  </g>

  <!-- White-haired elf mage: original simplified fan art -->
  <g id="elf" stroke="#2e4037" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".72s" repeatCount="indefinite"/>
    <g fill="none" stroke="#4e6657" stroke-width="8">
      <path d="M81 129 74 164"><animateTransform attributeName="transform" type="rotate" values="-10 81 129;10 81 129;-10 81 129" dur=".72s" repeatCount="indefinite"/></path>
      <path d="M105 129 113 164"><animateTransform attributeName="transform" type="rotate" values="10 105 129;-10 105 129;10 105 129" dur=".72s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#3d493f" stroke-width="2"><ellipse cx="72" cy="165" rx="13" ry="5"/><ellipse cx="116" cy="165" rx="13" ry="5"/></g>
    <path d="M59 94c4-27 20-38 36-38s33 11 37 38l11 56c-31 16-66 16-97 0Z" fill="url(#elfCloak)"/>
    <path d="M68 98c16 10 38 10 54 0" fill="none" stroke="#f5f0d8" stroke-width="5"/>
    <path d="M90 103v41M101 103v41" opacity=".35"/>
    <g fill="none" stroke="#788c7d" stroke-width="8">
      <path d="m63 103-20 29"><animateTransform attributeName="transform" type="rotate" values="8 63 103;-8 63 103;8 63 103" dur=".72s" repeatCount="indefinite"/></path>
      <path d="m127 103 16 27"><animateTransform attributeName="transform" type="rotate" values="-8 127 103;8 127 103;-8 127 103" dur=".72s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="95" cy="55" r="31" fill="#f0d0b5"/>
    <path d="M66 50 43 43l23 18M124 50l23-7-23 18" fill="#f0d0b5"/>
    <path d="M65 52c0-31 59-42 63 1l-10-11-7 12-7-15-9 15-9-14-9 14Z" fill="#eee9dc"/>
    <path d="M70 36c-10 21-8 44 4 62M119 35c11 21 9 44-3 63" fill="none" stroke="#eee9dc" stroke-width="12"/>
    <g fill="#456458" stroke="none"><ellipse cx="84" cy="59" rx="3" ry="4"/><ellipse cx="106" cy="59" rx="3" ry="4"/></g>
    <path d="M89 72c4 3 8 3 12 0" fill="none" stroke="#9f6f64" stroke-width="2"/>
    <path d="M145 43v103" fill="none" stroke="#705744" stroke-width="6"/>
    <circle cx="145" cy="34" r="12" fill="#d6e3d0"/>
    <path d="m145 20 7 11-7 11-7-11Z" fill="#f5e8a9"/>
  </g>

  <!-- Purple-haired apprentice mage -->
  <g id="mage" stroke="#2c3340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur=".72s" begin="-.22s" repeatCount="indefinite"/>
    <g fill="none" stroke="#38394e" stroke-width="8">
      <path d="M219 130 211 164"><animateTransform attributeName="transform" type="rotate" values="10 219 130;-10 219 130;10 219 130" dur=".72s" begin="-.22s" repeatCount="indefinite"/></path>
      <path d="M243 130 252 164"><animateTransform attributeName="transform" type="rotate" values="-10 243 130;10 243 130;-10 243 130" dur=".72s" begin="-.22s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#2b2d3b" stroke-width="2"><ellipse cx="208" cy="165" rx="13" ry="5"/><ellipse cx="255" cy="165" rx="13" ry="5"/></g>
    <path d="M194 91c5-26 20-36 38-36s33 10 38 36l10 61c-31 14-66 14-96 0Z" fill="url(#mageCloak)"/>
    <path d="M199 95c18 12 47 12 66 0" fill="none" stroke="#c5b6ca" stroke-width="5"/>
    <g fill="none" stroke="#5a526b" stroke-width="8">
      <path d="m199 103-17 27"><animateTransform attributeName="transform" type="rotate" values="-7 199 103;7 199 103;-7 199 103" dur=".72s" begin="-.22s" repeatCount="indefinite"/></path>
      <path d="m265 103 19 27"><animateTransform attributeName="transform" type="rotate" values="7 265 103;-7 265 103;7 265 103" dur=".72s" begin="-.22s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="232" cy="55" r="31" fill="#edcdb6"/>
    <path d="M199 52c0-34 65-40 67 1l-12-14-6 12-8-13-8 14-10-13-9 15Z" fill="#51445c"/>
    <path d="M203 45c-8 24-7 46 5 62M261 44c9 24 7 46-5 63" fill="none" stroke="#51445c" stroke-width="12"/>
    <g fill="#4b405d" stroke="none"><ellipse cx="221" cy="59" rx="3" ry="4"/><ellipse cx="243" cy="59" rx="3" ry="4"/></g>
    <path d="M226 72c4 2 8 2 12 0" fill="none" stroke="#9c6c66" stroke-width="2"/>
    <path d="M181 47v100" fill="none" stroke="#6d5144" stroke-width="6"/>
    <path d="M169 32h24l-12 20Z" fill="#b9d0c5"/>
    <circle cx="181" cy="31" r="6" fill="#ebe0a6"/>
  </g>

  <!-- Red-haired warrior -->
  <g id="warrior" stroke="#3e302d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 1;0 -3;0 1" dur=".72s" begin="-.44s" repeatCount="indefinite"/>
    <g fill="none" stroke="#513e37" stroke-width="9">
      <path d="M351 128 342 164"><animateTransform attributeName="transform" type="rotate" values="-10 351 128;10 351 128;-10 351 128" dur=".72s" begin="-.44s" repeatCount="indefinite"/></path>
      <path d="M376 128 385 164"><animateTransform attributeName="transform" type="rotate" values="10 376 128;-10 376 128;10 376 128" dur=".72s" begin="-.44s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#3a302c" stroke-width="2"><ellipse cx="338" cy="165" rx="14" ry="5"/><ellipse cx="390" cy="165" rx="14" ry="5"/></g>
    <path d="M325 91c5-25 21-35 39-35s34 10 40 35l10 61c-33 14-69 14-101 0Z" fill="url(#warriorCoat)"/>
    <path d="M331 101h67M364 97v52" fill="none" stroke="#e0b483" stroke-width="5"/>
    <g fill="none" stroke="#8a5547" stroke-width="9">
      <path d="m331 101-21 29"><animateTransform attributeName="transform" type="rotate" values="8 331 101;-8 331 101;8 331 101" dur=".72s" begin="-.44s" repeatCount="indefinite"/></path>
      <path d="m397 102 19 27"><animateTransform attributeName="transform" type="rotate" values="-8 397 102;8 397 102;-8 397 102" dur=".72s" begin="-.44s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="364" cy="55" r="31" fill="#efc6a9"/>
    <path d="M331 53c-1-31 60-44 67-4l-14-10-5 12-10-13-8 14-12-11-8 15Z" fill="#9d483a"/>
    <path d="m341 35-8-12 19 7 7-17 12 16 18-11-4 19" fill="#a84f3e"/>
    <g fill="#4c3832" stroke="none"><ellipse cx="353" cy="59" rx="3" ry="4"/><ellipse cx="376" cy="59" rx="3" ry="4"/></g>
    <path d="M357 72c5 3 10 3 14 0" fill="none" stroke="#9c665b" stroke-width="2"/>
    <path d="m405 42-49 105" fill="none" stroke="#6b5146" stroke-width="7"/>
    <path d="m394 42 21-18 13 9-12 25Z" fill="#c5ccd0"/>
  </g>

  <!-- Tiny dust motes -->
  <g fill="#cbbd92">
    <circle cx="33" cy="159" r="4"><animate attributeName="opacity" values="0;.55;0" dur="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="163;151;143" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="432" cy="164" r="3"><animate attributeName="opacity" values="0;.45;0" dur="1.2s" begin="-.5s" repeatCount="indefinite"/><animate attributeName="cy" values="165;154;147" dur="1.2s" begin="-.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
