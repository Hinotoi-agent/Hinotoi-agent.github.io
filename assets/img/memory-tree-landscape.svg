<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The luminous memory tree</title>
  <desc id="desc">An original twilight fantasy landscape with an ancient glowing tree, ruined stones, a reflective pool, drifting butterflies, and a solitary elven traveler.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#171b42"/><stop offset=".42" stop-color="#4f4f91"/><stop offset=".72" stop-color="#bc83ac"/><stop offset="1" stop-color="#f1bd9a"/>
    </linearGradient>
    <radialGradient id="dawn" cx="62%" cy="64%" r="45%">
      <stop stop-color="#ffd7a3" stop-opacity=".95"/><stop offset=".3" stop-color="#d98db6" stop-opacity=".55"/><stop offset="1" stop-color="#6b5ca0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#232648"/><stop offset=".48" stop-color="#44365c"/><stop offset="1" stop-color="#7a526b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6f6fa5" stop-opacity=".76"/><stop offset="1" stop-color="#172943" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1eee3"/><stop offset="1" stop-color="#8aa3b8"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="leafCloud">
      <circle cx="0" cy="0" r="74"/><circle cx="72" cy="-18" r="64"/><circle cx="-66" cy="-10" r="59"/><circle cx="30" cy="-62" r="55"/><circle cx="-18" cy="60" r="60"/>
    </g>
    <path id="butterfly" d="M0 0c-11-13-22-8-18 3 3 8 11 10 18 6 7 4 15 2 18-6 4-11-7-16-18-3Z"/>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#dawn)"/>

  <g fill="#d8d6ff" opacity=".72">
    <circle cx="152" cy="118" r="3"/><circle cx="280" cy="82" r="2"/><circle cx="432" cy="151" r="3"/><circle cx="1195" cy="91" r="3"/><circle cx="1332" cy="142" r="2"/><circle cx="1460" cy="72" r="3"/>
  </g>
  <g fill="#aeb4df" opacity=".24">
    <path d="M0 160c80-65 175-40 231 16 69-45 174-17 205 52H0Z"/>
    <path d="M1198 155c78-69 194-49 245 23 65-31 128 5 157 53v-94c-145-60-288-51-402 18Z"/>
  </g>

  <!-- Distant country and ruins -->
  <path d="M0 648c164-92 302-76 434-20 132-113 292-92 407-31 126-112 331-93 445-21 113-60 210-50 314-8v432H0Z" fill="#273450" opacity=".76"/>
  <path d="M0 701c200-71 384-49 534 20 188-70 367-54 523 13 176-72 365-67 543 2v264H0Z" fill="#1b3044"/>
  <g fill="#29324c" stroke="#7582a2" stroke-width="5" opacity=".9">
    <path d="M85 625 142 413l87-69 46 247-53 38-31-141-44 165Z"/>
    <path d="M244 591 295 474l56-22 19 121-36 20-20-69-25 80Z"/>
    <path d="M1344 626 1384 327l74-102 71 336-55 57-31-182-39 218Z"/>
    <path d="M1236 669 1268 497l65-57 29 158-43 58-24-91-17 113Z"/>
  </g>

  <!-- Tree aura -->
  <ellipse cx="968" cy="382" rx="505" ry="338" fill="#86d7e1" opacity=".16" filter="url(#glow)"/>
  <ellipse cx="980" cy="432" rx="370" ry="300" fill="#f4a9cf" opacity=".18" filter="url(#glow)"/>

  <!-- Ancient trunk and branches -->
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M925 794c33-137 31-260 5-379" stroke-width="120"/>
    <path d="M939 487c-79-81-160-128-256-150" stroke-width="48"/>
    <path d="M956 434c76-105 159-161 271-188" stroke-width="54"/>
    <path d="M930 378c-21-95-8-170 41-247" stroke-width="43"/>
    <path d="M900 450c-91-34-171-37-258-3" stroke-width="30"/>
    <path d="M980 382c95-51 188-58 290-27" stroke-width="31"/>
    <path d="M954 307c-68-65-137-90-219-86" stroke-width="29"/>
    <path d="M995 297c65-63 132-91 211-84" stroke-width="29"/>
  </g>
  <g fill="none" stroke="#b990b6" stroke-width="9" opacity=".42">
    <path d="M942 739c17-129 10-239-8-340"/><path d="M950 452c73-93 158-142 261-171"/><path d="M926 429c-69-56-142-89-229-103"/>
  </g>

  <!-- Luminous canopy, built from original clustered shapes -->
  <g filter="url(#soft)" opacity=".72">
    <use href="#leafCloud" x="678" y="242" fill="#6f82c6"/>
    <use href="#leafCloud" x="818" y="173" fill="#8d79c2"/>
    <use href="#leafCloud" x="982" y="146" fill="#78a9d2"/>
    <use href="#leafCloud" x="1146" y="188" fill="#9578c4"/>
    <use href="#leafCloud" x="1280" y="269" fill="#6379b3"/>
    <use href="#leafCloud" x="754" y="355" fill="#b07eb9"/>
    <use href="#leafCloud" x="939" y="302" fill="#80c3d0"/>
    <use href="#leafCloud" x="1123" y="339" fill="#cc86b0"/>
  </g>
  <g opacity=".95">
    <use href="#leafCloud" x="690" y="220" fill="#8b86d0" transform="scale(.72) translate(267 87)"/>
    <use href="#leafCloud" x="1100" y="214" fill="#a46fc2" transform="scale(.78) translate(309 60)"/>
    <use href="#leafCloud" x="879" y="280" fill="#7fc5d3" transform="scale(.65) translate(475 151)"/>
    <use href="#leafCloud" x="1265" y="326" fill="#d083b4" transform="scale(.62) translate(771 198)"/>
  </g>
  <g fill="#f5bfcb" opacity=".82">
    <circle cx="685" cy="297" r="10"/><circle cx="735" cy="191" r="8"/><circle cx="809" cy="324" r="12"/><circle cx="887" cy="119" r="9"/><circle cx="1014" cy="245" r="11"/><circle cx="1098" cy="129" r="8"/><circle cx="1213" cy="278" r="12"/><circle cx="1306" cy="333" r="9"/>
  </g>

  <!-- Water and reflections -->
  <path d="M416 734c223-42 682-31 882 20l-86 246H367Z" fill="url(#water)"/>
  <ellipse cx="918" cy="804" rx="356" ry="34" fill="#efb2c8" opacity=".18" filter="url(#soft)"/>
  <g fill="none" stroke="#c4c5e8" stroke-width="5" opacity=".32">
    <path d="M485 795c178-22 383-18 552 4"/><path d="M618 853c217-21 439-13 575 10"/><path d="M489 920c183-15 365-11 524 1"/>
  </g>

  <!-- Solitary elven traveler -->
  <g transform="translate(770 655)" stroke="#263246" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 79 0 224h113L69 79Z" fill="url(#robe)"/>
    <path d="M48 212 38 272M68 212l10 60" fill="none" stroke="#273248" stroke-width="13"/>
    <circle cx="57" cy="49" r="37" fill="#d7bcae"/>
    <path d="M21 44c2-48 74-58 78 2l-19-17-8 20-13-22-12 21-14-17Z" fill="#dfe2e7"/>
    <path d="M22 48 0 39l21 22M94 48l25-9-24 23" fill="#d7bcae"/>
    <path d="M17 38c-9 40-4 79 18 105M93 37c10 42 4 81-17 106" fill="none" stroke="#dfe2e7" stroke-width="15"/>
    <path d="M107 54v177" fill="none" stroke="#5e3e51" stroke-width="8"/>
    <path d="m107 31 17 20-17 19-17-19Z" fill="#c97c9e"/>
    <circle cx="107" cy="31" r="12" fill="#91d7d2"/>
  </g>

  <!-- Floating petals and butterflies -->
  <g fill="#f2b7d6">
    <use href="#butterfly" x="470" y="550" transform="rotate(-14 470 550)"/><use href="#butterfly" x="615" y="635" transform="scale(.7) rotate(18 615 635)"/><use href="#butterfly" x="1115" y="574" transform="scale(.8) rotate(-20 1115 574)"/><use href="#butterfly" x="1260" y="654" transform="scale(.58) rotate(22 1260 654)"/>
  </g>
  <g fill="#a8e1df" opacity=".86">
    <use href="#butterfly" x="568" y="416" transform="scale(.6)"/><use href="#butterfly" x="1168" y="440" transform="scale(.52)"/><use href="#butterfly" x="1375" y="530" transform="scale(.7)"/>
  </g>
  <g fill="#d6a2c0" opacity=".7"><path d="M358 389q22 9 2 24-18-10-2-24Z"/><path d="M520 286q18 7 2 20-17-8-2-20Z"/><path d="M1325 373q21 8 2 23-18-9-2-23Z"/><path d="M1456 465q17 7 2 19-15-7-2-19Z"/></g>

  <path d="M0 905c177-58 314-44 449 12 166-48 323-45 477 9 205-69 424-55 674 4v70H0Z" fill="#101d30"/>
</svg>
